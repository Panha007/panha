name: Deploy BLP Offers to Shopify

on:
  push:
    branches: [main]
    paths:
      - "blp-offers/**"
      - ".github/workflows/deploy-blp-offers.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blp-offers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run function tests
        run: npm test --workspace extensions/blp-offers-discount

      - name: Deploy app (functions)
        env:
          SHOPIFY_CLI_TTY: "0"
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: npx shopify app deploy --force --allow-updates --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
